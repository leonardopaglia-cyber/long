<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Acessível</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="form-container">
        <header class="form-header">
            <h1>Contact form</h1>
            <p>Please fill in your information and we'll be sending your order in no time.</p>
        </header>

        <form action="#" method="POST" class="contact-form">
            <!-- Nome -->
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Digite seu nome">
            </div>

            <!-- E-mail -->
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@dominio.com">
            </div>

            <!-- Telefone -->
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
            </div>

            <!-- Assunto -->
            <div class="form-group">
                <label for="subject">Message Subject</label>
                <select id="subject" name="subject">
                    <option value="other">Other</option>
                    <option value="support">Suporte</option>
                    <option value="sales">Vendas</option>
                </select>
            </div>

            <!-- Mensagem -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <!-- Verificação (Captcha Simples) -->
            <div class="form-group">
                <label for="verification">Verification</label>
                <input type="text" id="verification" name="verification" placeholder="Digite o código da imagem">
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn-submit">SUBMIT FORM</button>
        </form>
    </main>

</body>
</html>
